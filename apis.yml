name: RealNetworks
description: >-
  RealNetworks is a Seattle-based technology company that pairs AI-powered
  computer-vision and secure-communication products with its long-running
  consumer media brands. Its portfolio includes SAFR (facial recognition for
  security and retail loss prevention), Kontxt (AI messaging and voice security
  for CPaaS platforms, Telcos, and MNOs), GameHouse (cross-device casual
  gaming), and RealPlayer (media playback). Product APIs for SAFR and Kontxt are
  delivered through authenticated partner portals rather than an open developer
  portal; the historical Real Developer Program (developer.real.com) is no
  longer live, and no public OpenAPI specification was found during enrichment.
